name: Rebuild the sign

# Redraws the flip-dot sign in the README from live GitHub data once a day,
# and whenever the script that draws it changes.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/sign.yml"

permissions:
  contents: write

concurrency:
  group: sign
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The script has no dependencies. The runner's own Node is enough.
      - name: Draw the sign
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit it if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: rebuild the sign"
            git push
          fi
